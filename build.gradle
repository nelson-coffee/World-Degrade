plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    maven { url = 'https://maven.createmod.net' }          // Create, Ponder, Flywheel
    maven { url = 'https://maven.tterrag.com' }            // Registrate (Create dependency)
    maven {
        url = 'https://api.modrinth.com/maven'             // Waystones, Balm
        content { includeGroup 'maven.modrinth' }
    }
}

def sableCompanionDir = layout.buildDirectory.dir('sable-companion')

configurations {
    // Resolves the Sable mod jar on its own so extractSableCompanion can unpack
    // the companion classes Sable ships jar-in-jar.
    sableCompanion
}

dependencies {
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    compileOnly("net.createmod.catnip:Catnip-NeoForge-${minecraft_version}:${catnip_version}") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("maven.modrinth:waystones:${waystones_version}") { transitive = false }
    compileOnly("maven.modrinth:balm:${balm_version}") { transitive = false }
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }
    // Exposure, for PhotographFrameEntity's get/setItem. Supplementaries needs
    // no dependency — its globes are swapped by registry id.
    compileOnly("maven.modrinth:exposure:${exposure_version}") { transitive = false }
    // Open Parties and Claims (#6), for its addon-register event and claims API. Soft dependency:
    // the mod runs fine without it, the OPAC compat simply stays inactive.
    compileOnly("maven.modrinth:open-parties-and-claims:${opac_version}") { transitive = false }

    sableCompanion("maven.modrinth:sable:${sable_version}") { transitive = false }
    compileOnly fileTree(sableCompanionDir) {
        include '*.jar'
        builtBy 'extractSableCompanion'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// dev.ryanhcode.sable.companion.* is published only as a nested jar inside the
// Sable mod jar, so unpack it rather than vendoring a copy into the repo.
tasks.register('extractSableCompanion', Sync) {
    from({ zipTree(configurations.sableCompanion.singleFile) }) {
        include 'META-INF/jarjar/sable-companion-common-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
        includeEmptyDirs = false
    }
    into sableCompanionDir
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    // SectionBitStoreTest compiles against BlockPos/SectionPos and the Mojang
    // codecs, so the test source set needs the Minecraft artifacts too.
    addModdingDependenciesTo sourceSets.test

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
