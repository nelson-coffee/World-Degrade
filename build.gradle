plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    maven { url = 'https://maven.createmod.net' }          // Create, Ponder, Flywheel
    maven { url = 'https://maven.tterrag.com' }            // Registrate (Create dependency)
    maven {
        url = 'https://api.modrinth.com/maven'             // Waystones, Balm
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    compileOnly("net.createmod.catnip:Catnip-NeoForge-${minecraft_version}:${catnip_version}") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("maven.modrinth:waystones:${waystones_version}") { transitive = false }
    compileOnly("maven.modrinth:balm:${balm_version}") { transitive = false }
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }
    // Sable's companion math/access classes ship jar-in-jar, not on any maven;
    // extracted from the sable jar (see libs/) for compile-time visibility only.
    compileOnly files("libs/sable-companion-common-1.21.1-1.6.0.jar")
    // Exposure, for PhotographFrameEntity's get/setItem. Supplementaries needs
    // no dependency — its globes are swapped by registry id.
    compileOnly files("libs/exposure-neoforge-1.21.1-1.9.18.jar")
    // CC:Tweaked for computer/disk corruption feature.
    compileOnly files("run/mods/cc-tweaked-1.21.1-forge-1.120.0.jar")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
